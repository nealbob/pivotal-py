[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pivotal-lang"
version = "0.2.0"
description = "A pipeline-oriented data transformation DSL for Python and Jupyter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Neal Hughes" },
]
keywords = [
    "data",
    "dataframe",
    "transformation",
    "dsl",
    "pandas",
    "polars",
    "duckdb",
    "sql",
    "jupyter",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Full dependencies — installed by default with pip install pivotal
# For a minimal pandas-only install use: pip install --no-deps pivotal
dependencies = [
    "lark>=1.1",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "polars>=0.20",
    "duckdb>=0.9",
    "great-tables>=0.5",
    "css_inline>=0.13",
    "ipywidgets>=8.0",
    "ipyfilechooser>=0.6",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Granular extras for environments where only a specific backend is needed
# pip install pivotal[polars]
polars = [
    "polars>=0.20",
]
# pip install pivotal[duckdb]
duckdb = [
    "duckdb>=0.9",
]
# pip install pivotal[tables]
tables = [
    "great-tables>=0.5",
    "css_inline>=0.13",
]
# pip install pivotal[jupyter]
jupyter = [
    "ipywidgets>=8.0",
    "ipyfilechooser>=0.6",
]
# pip install pivotal[sql]
sql = [
    "sqlalchemy>=2.0",
]

[project.scripts]
pivotal = "pivotal.__main__:main"

[project.entry-points."pygments.lexers"]
pivotal = "pivotal.lexer:PivotalLexer"

[project.urls]
Homepage = "https://github.com/nealbob/pivotal-py"
Repository = "https://github.com/nealbob/pivotal-py"
"Bug Tracker" = "https://github.com/nealbob/pivotal-py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pivotal*"]
