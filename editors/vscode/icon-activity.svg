<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!--
    Monochrome version of the Pivotal pivot-wheel logo for VS Code activity bar.
    VS Code renders this as a mask (single theme color), so no gradients or
    background — only solid fills/strokes in one color.

    Three 110° arcs at r=40 from center (64,64), 10° gaps between them.
    Arc endpoints (same as full-color logo):
      Arc 1 (slate):  275°→25°   start=(67.49,24.15)  end=(100.25,80.90)
      Arc 2 (blue):    35°→145°  start=( 96.77,86.94)  end=( 31.23,86.94)
      Arc 3 (amber):  155°→265°  start=( 27.75,80.90)  end=( 60.51,24.15)
    Radial line tips at r=50:
      340° → (112.28, 46.00)
      240° → (39.00,  20.00)
  -->

  <!-- Dim track ring -->
  <circle cx="64" cy="64" r="40" fill="none"
          stroke="currentColor" stroke-width="15" opacity="0.25"/>

  <!-- Arc 1: top → lower-right -->
  <path d="M 67.49 24.15 A 40 40 0 0 1 100.25 80.90"
        fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>

  <!-- Arc 2: lower-right → lower-left -->
  <path d="M 96.77 86.94 A 40 40 0 0 1 31.23 86.94"
        fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>

  <!-- Arc 3: lower-left → top -->
  <path d="M 27.75 80.90 A 40 40 0 0 1 60.51 24.15"
        fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>

  <!-- Radial lines from center to arc outer edge -->
  <line x1="64" y1="64" x2="112.28" y2="46.00"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="64" y1="64" x2="39.00" y2="20.00"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Center pivot point -->
  <circle cx="64" cy="64" r="7" fill="currentColor"/>
</svg>
