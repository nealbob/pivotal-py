[build-system]
requires = [
    "hatchling>=1.5.0",
    "hatch-jupyter-builder>=0.5",
    "jupyterlab>=4.0.0,<5",
]
build-backend = "hatchling.build"

[project]
name = "pivotal-jupyterlab"
version = "0.1.0"
description = "JupyterLab syntax highlighting for the Pivotal data transformation DSL"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "jupyterlab>=4.0.0,<5",
]

[project.urls]
Homepage = "https://github.com/pivotal/pivotal-py"
Repository = "https://github.com/pivotal/pivotal-py"

[tool.hatch.build.targets.wheel.shared-data]
"install.json" = "share/jupyter/labextensions/@pivotal/jupyterlab/install.json"
"pivotal_jupyterlab/labextension" = "share/jupyter/labextensions/@pivotal/jupyterlab"

[tool.hatch.build.targets.sdist]
artifacts = ["pivotal_jupyterlab/labextension"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "pivotal_jupyterlab/labextension/package.json",
    "pivotal_jupyterlab/labextension/static/style.js",
]
skip-if-exists = ["pivotal_jupyterlab/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.jupyter-releaser.options]
version-cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-bump-version = ["pip install hatch", "hatch version"]
before-release = ["pip install .", "jupyter labextension list"]
