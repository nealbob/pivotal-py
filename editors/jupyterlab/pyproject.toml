[build-system]
requires = [
    "hatchling>=1.5.0",
    "hatch-jupyter-builder>=0.5",
    "jupyterlab>=4.0.0,<5",
]
build-backend = "hatchling.build"

[project]
name = "pivotal-lab"
version = "0.7.0"
description = "JupyterLab extension for the Pivotal data transformation DSL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "jupyterlab>=4.0.0,<5",
]

[project.urls]
Homepage = "https://github.com/nealbob/pivotal-py"
Repository = "https://github.com/nealbob/pivotal-py"
"Changelog" = "https://github.com/nealbob/pivotal-py/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["pivotal_jupyterlab"]
only-include = ["pivotal_jupyterlab"]

[tool.hatch.build.targets.wheel.shared-data]
"pivotal_jupyterlab/labextension" = "share/jupyter/labextensions/@pivotal/jupyterlab"
"pivotal_jupyterlab/ipython_config.d/pivotal.py" = "etc/ipython/ipython_config.d/pivotal.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
artifacts = ["pivotal_jupyterlab/labextension"]
exclude = [
    ".yarn",
    "node_modules",
    "lib",
    "src",
    "build.ps1",
    "tsconfig.json",
    "package.json",
    "package-lock.json",
    "yarn.lock",
    ".yarnrc.yml",
]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "pivotal_jupyterlab/labextension/package.json",
    "pivotal_jupyterlab/labextension/static/style.js",
]
skip-if-exists = ["pivotal_jupyterlab/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.jupyter-releaser.options]
version-cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-bump-version = ["pip install hatch", "hatch version"]
before-release = ["pip install .", "jupyter labextension list"]
