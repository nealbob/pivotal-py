<svg viewBox="0 0 272 90" width="272" height="90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#080F1C"/>
    </linearGradient>
    <filter id="wm-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="272" height="90" rx="16" fill="url(#wm-bg)"/>

  <g transform="translate(4, -3)">
  <text x="18" y="66"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="600" fill="white"
        letter-spacing="-1">piv</text>

  <!--
    Wheel: scale=0.5, centre at (152, 45) → spans x:[128,176] y:[21,69].
    Baseline y=69 gives equal top/bottom gaps (~21px each).
    transform = translate(152 - 64×0.5, 45 - 64×0.5) = translate(120, 13)
  -->
  <g transform="translate(107, 21) scale(0.44)">
    <circle cx="64" cy="66" r="40" fill="none"
            stroke="#1E3A5F" stroke-width="15" opacity="0.45"/>
    <path d="M 67.49 24.15 A 40 40 0 0 1 100.25 80.90"
          fill="none" stroke="#94A3B8" stroke-width="15" stroke-linecap="round"/>
    <path d="M 96.77 86.94 A 40 40 0 0 1 31.23 86.94"
          fill="none" stroke="#3B82F6" stroke-width="15" stroke-linecap="round"/>
    <path d="M 27.75 80.90 A 40 40 0 0 1 60.51 24.15"
          fill="none" stroke="#F59E0B" stroke-width="15" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="108.17" y2="47.93"
          stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <line x1="64" y1="64" x2="40.50"  y2="23.30"
          stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <circle cx="64" cy="66" r="8.5" fill="white" filter="url(#wm-glow)"/>
    <circle cx="64" cy="66" r="4"   fill="#0F172A"/>
  </g>

  <text x="161" y="66"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="600" fill="white"
        letter-spacing="-1">tal</text>
  </g>
</svg>
