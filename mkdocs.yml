site_name: Pivotal
site_description: A pipeline-oriented data transformation DSL for Python and Jupyter
repo_url: https://github.com/nealbob/pivotal-py
repo_name: nealbob/pivotal-py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Why Pivotal?: whypivotal.md
  - Getting Started: getting-started.md
  - User Guide:
    - syntax/index.md
    - Data Sources: syntax/data-sources.md
    - Filtering: syntax/filtering.md
    - Data Quality: syntax/data-quality.md
    - Selection: syntax/selection.md
    - Column Expressions: syntax/transformation.md
    - Lists and Functions: syntax/functions.md
    - Sorting: syntax/sorting.md
    - Grouping & Aggregation: syntax/grouping.md
    - Merge and Concatenate: syntax/joining.md
    - Pivot Tables: syntax/reshaping.md
    - Window Functions: syntax/window-functions.md
    - Missing Data: syntax/missing-data.md
    - Python Integration: syntax/python-interop.md
    - Output: syntax/output.md
    - Saving: syntax/saving.md
  - Syntax Reference: syntax/command-reference.md
  - Backends: backends.md
  - Comparison: comparison.md
  - Editors:
    - JupyterLab: jupyter.md
    - VS Code: vscode.md
  - Python API: api.md
  - CLI: cli.md
