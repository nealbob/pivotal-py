# fly.toml app configuration file generated for pivotal-py on 2026-05-08T09:30:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pivotal-py'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile.mcp-readonly'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
